name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24.x]
        include:
          # Node 22 上 node:sqlite 还是实验性 API，需要显式开关
          - os: ubuntu-latest
            node: 22.x
            node-options: --experimental-sqlite
          - os: windows-latest
            node: 22.x
            node-options: --experimental-sqlite
    env:
      NODE_OPTIONS: ${{ matrix.node-options }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 这个仓库不依赖第三方包；npm ci 会在没有 lockfile 时报错，所以不跑
      - name: 环境信息
        run: |
          node -v
          node -e "console.log('vector ext present:', require('node:fs').existsSync('vec0.dll'))"

      # ubuntu 上没有 vec0.dll（Windows 二进制），预期走"仅关键词"降级路径。
      # 这个 job 存在的意义就是：证明降级路径也是绿的。
      - name: smoke test
        run: npm test

      - name: 规模基准（1 万条，验证基准脚本本身不坏）
        run: node examples/bench-scale.cjs 10000
